name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The site is served from /<repo-name>/ unless the repo is <user>.github.io.
      # For a custom domain, set a repository variable BASE_HREF to "/".
      - name: Work out base href
        id: base
        run: |
          REPO="${{ github.event.repository.name }}"
          if [ -n "${{ vars.BASE_HREF }}" ]; then
            BASE="${{ vars.BASE_HREF }}"
          elif [[ "$REPO" == *.github.io ]]; then
            BASE="/"
          else
            BASE="/$REPO/"
          fi
          echo "Using base href: $BASE"
          echo "href=$BASE" >> "$GITHUB_OUTPUT"

      - run: npx ng build --base-href "${{ steps.base.outputs.href }}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/saisree-resume/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
